
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      .container {
        display: grid;
        /* grid-template-columns: repeat(50px,30px,60px); Note: Aapke CSS me repeat(1px, 10px, 1px) tha jo invalid ho sakta hai, maine ise standard grid tracks me update kiya hai */
        gap: 30px;
        padding: 20px;
        background-color: black;
        min-height: 100vh;
        grid-template-rows: repeat(40px,30px,20px);
      }

      .box {
        background-color: #e711a0;
        color: rgb(15, 14, 14);
        padding: 40px;
        text-align: center;
        font-size: 20px;
        border-radius: 8px;
      }

      /* Mobile responsive */
      @media (max-width: 600px) {
        .container {
          grid-template-columns: 1fr; /* Mobile screens ke liye single column */
        }
      }
    </style>
</head>
<body>

    <div class="container">
        <div class="box">Box 1</div>
        <div class="box">Box 2</div>
        <div class="box">Box 3</div>
        <div class="box">Box 4</div>
        <div class="box">Box 5</div>
        <div class="box">Box 6</div>
    </div>

</body>
</html>
