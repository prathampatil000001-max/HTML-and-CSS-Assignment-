<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent {
            display: grid;
            border: 2px solid red;
            height: 90vh;
        }

        .parent div {
            border: 2px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .one {
            grid-area: 1;
            background-color: pink;
            grid-column-start: 1;
            grid-column-end: 2;
            grid-row-start: 1;
            grid-row-end: 4;

        }

        .two {
            grid-area: 2;
            background-color: plum;
            grid-column-start: 2;
            grid-column-end: 3;
            grid-row-start: 1;
            grid-row-end: 3;
        }

        .three {
            grid-area: 3;
            background-color: blueviolet;
            grid-column-start: 3;
            grid-column-end:4 ;
            grid-row-start: 1;
            grid-row-end: 3;
        }

        .four {
            grid-area: 4;
            background-color: peachpuff;
            grid-column-start:4;
            grid-column-end: 5;
            grid-row-start: 1;
            grid-row-end: 3;
        }

        .five {
            background-color: purple;
            grid-area: 5;
            grid-column-start:2;
            grid-column-end: 5;
            grid-row-start: 3;
            grid-row-end: 5;
        }
        .six{
            background-color: lightblue;
            grid-area: 6;
            grid-column-start:1;
            grid-column-end: 2;
            grid-row-start: 4;
            grid-row-end: 7;
        }
        .seven{
            background-color: lightseagreen;
            grid-area: 7;
            grid-column-start:2;
            grid-column-end: 3;
            grid-row-start: 5;
            grid-row-end: 7;
        }
        .eight{
            background-color: lightcoral;
            grid-area: 8;
            grid-column-start:3;
            grid-column-end: 5;
            grid-row-start: 5;
            grid-row-end: 7;
        }

    @media screen and (max-width: 600px) 
        {

            .one {
            grid-area: 1;
            background-color: pink;
            grid-column-start: 1;
            grid-column-end: 1;
            grid-row-start: 1;
            grid-row-end: 3;

        }

        .two {
            grid-area: 2;
            background-color: plum;
            grid-column-start: 2;
            grid-column-end: 3;
            grid-row-start: 2;
            grid-row-end: 3;
        }

        .three {
            grid-area: 3;
            background-color: blueviolet;
            grid-column-start: 3;
            grid-column-end:4 ;
            grid-row-start: 2;
            grid-row-end: 3;
        }

        .four {
            grid-area: 4;
            background-color: peachpuff;
            grid-column-start:4;
            grid-column-end: 5;
            grid-row-start: 2;
            grid-row-end: 3;
        }

        .five {
            background-color: purple;
            grid-area: 5;
            grid-column-start:2;
            grid-column-end: 5;
            grid-row-start: 1;
            grid-row-end: 2;
        }
        .six{
            background-color: lightblue;
            grid-area: 6;
            grid-column-start:1;
            grid-column-end: 1;
            grid-row-start: 3;
            grid-row-end: 6;
        }
        .seven{
            background-color: lightseagreen;
            grid-area: 7;
            grid-column-start:2;
            grid-column-end: 2;
            grid-row-start: 3;
            grid-row-end: 6;
        }
        .eight{
            background-color: lightcoral;
            grid-area: 8;
            grid-column-start:3;
            grid-column-end: 5;
            grid-row-start: 3;
            grid-row-end: 6;
        }




        }


    
    </style>
</head>

<body>
    <div class="parent">
        <div class="one">
            <p>1</p>
        </div>
        <div class="two">
            <p>2</p>
        </div>
        <div class="three">
            <p>3</p>
        </div>
        <div class="four">
            <p>4</p>
        </div>
        <div class="five">
            <p>5
            </p>
        </div>
        <div class="six">
            <p>6</p>
        </div>
        
        <div class="seven">
            <p>7</p>
        </div>
        <div class="eight">
            <p>8</p>
        </div>
    

</html>
