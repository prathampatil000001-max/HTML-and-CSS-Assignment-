<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liberetty Landing Page</title>
  <style>
    /* Global Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #e5eceb;
      color: #1a1a1a;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Navigation Bar */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 30px 60px;
      width: 100%;
      background: transparent;
    }

    .logo {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      text-decoration: none;
      color: #1a1a1a;
    }

    .logo span {
      color: #ff5023;
      font-size: 20px;
      vertical-align: super;
      margin-left: 2px;
    }

    nav {
      display: flex;
      gap: 35px;
    }

    nav a {
      text-decoration: none;
      color: #4a5568;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: color 0.2s;
    }

    nav a:hover {
      color: #000;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .search-icon {
      cursor: pointer;
      display: flex;
      align-items: center;
    }

    .cart-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      color: #1a1a1a;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .cart-badge {
      background-color: #ff5023;
      color: #fff;
      font-size: 11px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
    }

    
    .hero {
      position: relative;
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 60px 20px 100px;
    }

    
    .headline-container {
      max-width: 850px;
      z-index: 2;
    }

    h1 {
      font-size: 72px;
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -1.5px;
      color: #111;
    }

    .inline-avatar {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      vertical-align: middle;
      object-fit: cover;
      border: 2px solid #1a1a1a;
      margin: 0 10px;
      display: inline-block;
    }

    
    .badge-new {
      position: absolute;
      top: 28%;
      left: 12%;
      background-color: #2bbd9b;
      color: #0d382e;
      font-size: 10px;
      font-weight: 800;
      padding: 6px 14px;
      transform: rotate(-14deg);
      border-radius: 2px;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    .product-day-stamp {
      position: absolute;
      top: 25%;
      right: 30%;
      font-size: 9px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      line-height: 1.2;
      text-align: left;
    }
    
    .product-day-stamp::before {
      content: "Ⓡ";
      font-size: 16px;
      position: absolute;
      left: -18px;
      top: -2px;
    }

   
    .shape-square-black {
      position: absolute;
      top: 24%;
      left: 24%;
      width: 24px;
      height: 24px;
      background-color: #1a1a1a;
      transform: rotate(20deg);
    }

    .shape-triangle-orange-small {
      position: absolute;
      top: 42%;
      left: 28%;
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-bottom: 24px solid #ff6b35;
      transform: rotate(60deg);
    }

    .shape-triangle-orange-large {
      position: absolute;
      bottom: 12%;
      right: 38%;
      width: 0;
      height: 0;
      border-left: 30px solid transparent;
      border-right: 30px solid transparent;
      border-bottom: 70px solid #ff6b35;
      transform: rotate(-55deg);
    }

    .shape-purple-cube {
      position: absolute;
      bottom: 25%;
      right: 14%;
      width: 32px;
      height: 42px;
      background-color: #7b4eff;
      transform: rotate(25deg) skew(-10deg);
      border-radius: 3px;
    }

    
    .svg-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    
    .watch-story-btn {
      position: absolute;
      bottom: 15%;
      right: 24%;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background-color: #1a1a1a;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 3;
      transition: transform 0.3s ease;
    }

    .watch-story-btn:hover {
      transform: scale(1.05);
    }

    .watch-story-btn svg.arrow {
      width: 20px;
      height: 20px;
      stroke: #fff;
      stroke-width: 2;
      fill: none;
    }

    .circular-text {
      position: absolute;
      width: 100%;
      height: 100%;
      animation: rotateText 20s linear infinite;
    }

    .circular-text text {
      font-size: 8.5px;
      font-weight: 700;
      letter-spacing: 2.2px;
      fill: #ffffff;
      text-transform: uppercase;
    }

    @keyframes rotateText {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .pr{
      border: 2px solid black;
    }
  </style>
</head>
<body>

  
  <header class="pr">
    <a href="#" class="logo">Liberetty<span>+</span></a>
    <nav >
      <a href="#">Products ▾</a>
      <a href="#">3D Models ▾</a>
      <a href="#">Gallery</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
    <div class="nav-actions">
      <div class="search-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </div>
      <a href="#" class="cart-btn">
        CART <span class="cart-badge">1</span>
      </a>
    </div>
  </header>

  
  <main class="hero">
    
  
    <svg class="svg-canvas" viewBox="0 0 1000 500" preserveAspectRatio="none">
    
      <path d="M 80 180 C 130 450, 520 480, 525 385" fill="none" stroke="#1a1a1a" stroke-width="1.2" />
      <circle cx="138" cy="183" r="4.5" fill="#1a1a1a" />

    
      <path d="M 460 190 Q 550 140 600 200" fill="none" stroke="#1a1a1a" stroke-width="1.2" />

      
      <path d="M 890 200 C 870 210, 860 250, 880 260 C 900 270, 860 310, 825 330" fill="none" stroke="#1a1a1a" stroke-width="1.2" />
      <circle cx="825" cy="330" r="4" fill="#1a1a1a" />
    </svg>

    
    <div class="badge-new">NEW MODELS</div>
    <div class="product-day-stamp">PRODUCT<br>OF THE DAY</div>
    
    <div class="shape-square-black"></div>
    <div class="shape-triangle-orange-small"></div>
    <div class="shape-triangle-orange-large"></div>
    <div class="shape-purple-cube"></div>

    
    <div class="headline-container">
      <h1>
        We <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80" alt="Avatar" class="inline-avatar"> produce<br>
        high-quality furniture<br>
        for lifestyle
      </h1>
    </div>

    
    <div class="watch-story-btn">
      <svg class="circular-text" viewBox="0 0 100 100">
        <path id="circlePath" d="M 50, 50 m -37, 0 a 37,37 0 1,1 74,0 a 37,37 0 1,1 -74,0" fill="none" />
        <text>
          <textPath href="#circlePath">
            • WATCH OUR STORY • WATCH OUR STORY
          </textPath>
        </text>
      </svg>
      <svg class="arrow" viewBox="0 0 24 24">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
    </div>

  </main>

</body>
</html>
