    <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sidebar Menu</title>
  <!-- Including Font Awesome icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<style>

/* Reset default page margins and set background */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background-color: #a3c4e5;
  height: 100vh;
}

/* --- MAIN SIDEBAR CONTAINER --- */
.sidebar {
  width: 260px;
  height: 100vh; /* Full screen height */
  background-color: #ffffff;
  border-right: 1px solid #e0e0e0;
  display: flex;
  flex-direction: column; /* Stack children top to bottom */
  padding: 20px;
}

/* --- COMPANY HEADER --- */
.company-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding-bottom: 20px;
  margin-bottom: 10px;
  border-bottom: 1px solid #f0f0f0;
}

.avatar-circle {
  width: 36px;
  height: 36px;
  background-color: #2563eb;
  color: white;
  border-radius: 50%; /* Makes it a circle */
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
}

.company-name {
  font-weight: 600;
  color: #1e293b;
  font-size: 15px;
}

/* --- NAVIGATION MENU --- */
.nav-menu {
  display: flex;
  flex-direction: column;
  flex-grow: 1; /* Takes up available space to allow push down */
  gap: 4px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  color: #64748b;
  text-decoration: none; /* Remove underline */
  border-radius: 8px;
  font-size: 14px;
  transition: background-color 0.2s, color 0.2s;
}

.nav-item i {
  font-size: 16px;
  width: 20px; /* Fixed width keeps icons aligned */
  text-align: center;
}

/* Hover effect on links */
.nav-item:hover {
  background-color: #f1f5f9;
  color: #1e293b;
}

/* Active link style */
.nav-item.active {
  background-color: #e0e7ff;
  color: #2563eb;
  font-weight: 600;
}

/* Badge count for notifications */
.badge {
  margin-left: auto; /* Pushes the badge to the far right */
  background-color: #ef4444;
  color: white;
  font-size: 12px;
  padding: 2px 8px;
  border-radius: 12px;
  font-weight: bold;
}

/* Spacer pushes Settings/Support to the bottom */
.spacer {
  margin-top: auto;
}

/* --- USER PROFILE SECTION --- */
.user-profile {
  display: flex;
  align-items: center;
  gap: 12px;
  padding-top: 15px;
  margin-top: 10px;
  border-top: 1px solid #f0f0f0;
}

.user-avatar {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  object-fit: cover;
}

.user-info {
  display: flex;
  flex-direction: column;
}

.user-name {
  font-size: 14px;
  font-weight: 600;
  color: #1e293b;
}

.user-email {
  font-size: 12px;
  color: #94a3b8;
}</style>
<body>

  
  <aside class="sidebar">
    
    
    <div class="company-header">
      <div class="avatar-circle">A</div>
      <span class="company-name">ALF Pte. Ltd.</span>
    </div>

    
    <nav class="nav-menu">
      <a href="#" class="nav-item active">
        <i class="fa-solid fa-house"></i>
        <span>Dashboard</span>
      </a>

      <a href="#" class="nav-item">
        <i class="fa-regular fa-bell"></i>
        <span>Notifications</span>
        <span class="badge">4</span>
      </a>

      <a href="#" class="nav-item">
        <i class="fa-regular fa-folder"></i>
        <span>Projects</span>
      </a>

      <a href="#" class="nav-item">
        <i class="fa-regular fa-square-check"></i>
        <span>Tasks</span>
      </a>

      <a href="#" class="nav-item">
        <i class="fa-solid fa-chart-line"></i>
        <span>Analytics</span>
      </a>

      
      <div class="spacer"></div>

      <a href="#" class="nav-item">
        <i class="fa-solid fa-gear"></i>
        <span>Settings</span>
      </a>

      <a href="#" class="nav-item">
        <i class="fa-regular fa-circle-question"></i>
        <span>Support</span>
      </a>
    </nav>

    
    <div class="user-profile">
      <img src="pratham.png" alt="User Profile" class="user-avatar">
      <div class="user-info">
        <p class="user-name">John Doe</p>
        <p class="user-email">johndoe@gmail.com</p>
      </div>
    </div>

  </aside>

</body>
</html>
</body>
</html>
