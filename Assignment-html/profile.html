<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Flip Card</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: system-ui, sans-serif;
    }

    .flip-card {
      background-color: transparent;
      width: 300px;
      height: 400px;
      perspective: 1000px;
    }

    .flip-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transform-style: preserve-3d;
      border-radius: 20px;
      box-shadow: 0 20px 30px rgba(0, 0, 0, 0.3);
    }

    .flip-card:hover .flip-card-inner {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px;
    }

    .card-front {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #f8fafc;
    }

    .card-front h3 {
      font-size: 1.5rem;
      margin-top: 15px;
    }

    .card-back {
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: #ffffff;
      transform: rotateY(180deg);
    }

    .card-back p {
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .social-btn {
      display: inline-block;
      padding: 10px 20px;
      background: #ffffff;
      color: #1d4ed8;
      text-decoration: none;
      font-weight: bold;
      border-radius: 30px;
    }
  </style>
</head>
<body>

  <div class="flip-card right side">
    <div class="flip-card-inner">
      <div class="card-front">
        <svg width="80" height="80" fill="none" stroke="#3b82f6" stroke-width="1.5" viewBox="0 0 24 24">
          <circle cx="12" cy="8" r="5"/>
          <path d="M20 21a8 8 0 10-16 0"/>
        </svg>
        <h3>Prathammm
        </h3>
        <p style="color: #94a3b8; font-size: 0.9rem; margin-top: 5px;">Frontend Developer</p>
      </div>
      <div class="card-back">
        <h3>Connect With Me</h3>
        <p>Passionate about building intuitive UI animations and modern web experiences using CSS.</p>
        <a href="#" class="social-btn">View Profile</a>
      </div>
    </div>
  </div>

</body>
</html>
