<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<style>
    .container{
        border: 3px solid black;
        width: 170px;
    }

    .container:focus{
        outline: 3px solid red;
        background-color: black;
        color: white;
        border: none;


    }
    .input:focus{
        outline: 3px solid red;
        margin: 700px;
        background-color: black;
        color: white;
        box-shadow: 50px;
        box-shadow: 50px 50px 5px;
        transition: 16s ease-in;
    }
    </style>
</head>
<body>
    <div class="container">
    <input type="text" class="input" placeholder="Enter text">
    </div>
</body>

</html>
