<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Furniture Home Page</title>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, ;
    background-color: white;
}



.navbar {
    width: 76%;
    height: 70px;

    position: absolute;
    top: 25px;
    left: 12%;

    background-color: white;

    border: 2px solid #e9b82e;
    border-radius: 10px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 28px;

    z-index: 10;

    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
}



.nav-left,
.nav-right {
    display: flex;
    align-items: center;
    gap: 35px;
}

.navbar a {
    text-decoration: none;
    color: #555;
    font-size: 14px;
}

.navbar a:hover {
    color: black;
}



.logo {
    font-size: 30px;
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
}

.search {
    font-size: 25px;
    color: #555;
    transform: rotate(-20deg);
}

.profile {
    width: 28px;
    height: 28px;

    border-radius: 50%;

    background-color: #f2b52b;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 16px;
}



.hero {
    width: 74%;
    height: 500px;

    margin: 95px auto 0;

    display: flex;

    overflow: hidden;
}




.hero-content {
    width: 50%;

    background-color: #dff5f5;

    padding: 27px 45px;
}

.hero-content p {
    font-size: 8px;
    color: #333;

    margin-bottom: 5px;
}

.hero-content h1 {
    font-family: Georgia, serif;

    font-size: 61px;
    font-weight: 400;

    line-height: 1.03;

    color: #111;

    margin-bottom: 25px;
}




.hero-content button {
    background-color: #171717;
    color: white;

    border: none;
    border-radius: 4px;

    padding: 8px 13px;

    font-size: 9px;

    cursor: pointer;
}

.hero-content button:hover {
    background-color: #333;
}




.hero-image {
    width: 50%;
    height: 100%;
}

.hero-image img {
    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;
}
    </style>
</head>
<body>

    
    <nav class="navbar">

        <div class="nav-left">
            <a href="#">Home</a>
            <a href="#">Collection</a>
            <a href="#">Cart</a>
            <a href="#">Contact</a>
        </div>

        <!-- Logo -->
        <div class="logo">

        </div>

        <div class="nav-right">
            <a href="#">Shops</a>
            <a href="#">Account</a>
            <span class="search">⌕</span>
            <div class="profile">👨🏻</div>
        </div>

    </nav>

                                       
    <!-- Hero Section -->
    <section class="hero">

        <div class="hero-content">
            <p>Furniture Home</p>

            <h1>
                Embrace<br>
                Peaceful<br>
                Oasis
            </h1>

            <button>
            Shop Now ↗
            </button>
        </div>

        <div class="hero-image">
            <img src="/WhatsApp Image 2026-09-11 at 8.21.32 PM.jpeg" alt="Furniture">
        </div>

    </section>

</body>
</html>
