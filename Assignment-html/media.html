<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .skewy-example1 {
   
      width: 200px;
      height: 100px;
      background-color: lightblue;
      padding: 60px;
      color: black;
      
      transition: transform 50s ease-in-out;
      
   
    }
    .skewy-example1:hover {
      transform:rotate(800000000000000deg);
    }
    .skewy-example2 {
      width: 200px;
      height: 100px;
      background-color: lightgreen;
      padding: 60px;
      color: black;
      
      transition: transform 5s ease-in-out;
    }
    .skewy-example2:hover {
      transform: skewY(2000000000000000000000000deg);
    }
  </style>
</head>
<body>
<div class="skewy-example1">Skewed 20 degrees on y-axis</div>
<div class="skewy-example2">Skewed 20 degrees on x-axis</div>

<dialog open>
  <p>This is a dialog box.</p>
  <button class="example2">Close</button>
</body>
</html>
