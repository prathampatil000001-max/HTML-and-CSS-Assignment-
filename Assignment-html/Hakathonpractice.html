<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Component</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
</head>


<style>
     * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Outfit', sans-serif;
  background-color: hsl(212, 45%, 89%);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.card {
  background-color: hsl(0, 0%, 100%);
  width: 320px;
  padding: 16px;
  border-radius: 20px;
  box-shadow: 0 25px 25px rgba(0, 0, 0, 0.047);
  text-align: center;
}

.qr-container {
  background-color: hsl(218, 44%, 22%);
  border-radius: 12px;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
}

.qr-container img {
  width: 100%;
  height: auto;
  display: block;
  border-radius: 10px;
}

.card-content {
  padding: 24px 12px 16px 12px;
}

.card-content h1 {
  color: hsl(218, 44%, 22%);
  font-size: 22px;
  font-weight: 700;
  line-height: 1.3;
  margin-bottom: 16px;
}

.card-content p {
  color: hsl(220, 15%, 55%);
  font-size: 15px;
  font-weight: 400;
  line-height: 1.4;
  letter-spacing: 0.2px;
}




</style>
<body>

  <main class="card">
    <div class="qr-container">
      
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=https://www.frontendmentor.io" alt="QR Code">
    </div>
    <div class="card-content">
      <h1>Improve your front-end skills by building projects</h1>
      <p>Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
    </div>
  </main>

</body>
</html>
