<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body {
      background-color: #f0f0f0;
      font-family: Arial, sans-serif;
    }
  .container {
    width: 180px;
    height: 180px;
    border: 1px solid rgb(164, 164, 164);
    margin: 30px;
    perspective: 500px;
    box-shadow: 0px 0px 10px rgb(99, 98, 98);
    transition: all  linear;
  }

  .box {
    width: 180px;
    height: 180px;
    background-color: rgb(95, 13, 171);
    transform: rotateX(45deg) translateZ(50px);
    box-shadow: 2px 2px 10px rgb(28, 13, 11);
  }
  .box:hover {
    transform: rotateX(-150deg) rotateY(-45deg) translateZ(50px);
    transition: transform 0.9s ease-in-out;                     /* transition-duration */
    transition-duration: 1s;            
    transition-delay: 0.2s;
    background-color: rgb(252, 77, 77);
    animation: animate 2s linear infinite;
  }
  @keyframes animate {
    0% {
      border-radius: 0%;
      transform: rotateX(0deg) rotateY(0deg) translateZ(50px);
    }
    100% {
      width: 0px;
      height: 0px;
      border-radius: 100%;
      background-color: rgb(215, 30, 110);
      transform: rotateX(360deg) rotateY(360deg) translateZ(50px);
    }
  }
  .container1 {
  width: 200px;
  height: 200px;
  margin: 100px auto;
  perspective: 600px;
  }
  .cube {
  width: 100%;
  height: 100%;
  position: relative;
  transform-style: preserve-3d;
  animation: spin 12s infinite linear;
  }
  .face {
  position: absolute;
  width: 200px;
  height: 200px;
  border: 0.5px solid rgb(228, 194, 19);
  background: rgba(248, 126, 13, 0.5);
  box-shadow: inset 0 10px 30px rgba(207, 19, 19, 0.2);
  transition-delay: 5s;
  }
  .front { 
    transform: rotateY( 0deg) translateZ(100px);
  }
  .back {
     transform: rotateY(180deg) translateZ(100px); 
  }
  .left {
    transform: rotateY(-90deg) translateZ(100px);
  }
  .right {
    transform: rotateY( 90deg) translateZ(100px); 
  }
  .top {
     transform: rotateX( 90deg) translateZ(100px); 
  }
  .bottom {
     transform: rotateX(-90deg) translateZ(100px); 
  }

  @keyframes spin {
    from {
       transform: rotateX(0deg) rotateY(0deg);
    }
    to {
       transform: rotateX(360deg) rotateY(360deg); 
    }
  }

  .container2 {
  width: 200px;
  height: 200px;
  margin: 100px auto;
  perspective: 600px;
  }
  .sphere {
  width: 100%;
  height: 100%;
  border-radius: 100%;
  position: relative;
  transform-style: preserve-3d;
  animation: spin 12s infinite linear;
  background: rgba(82, 75, 234, 0.5);
  }

  @keyframes spin {
    from {
       transform: rotateX(70deg) rotateY(50deg);
    }
    to {
       transform: rotateX(360deg) rotateY(360deg); 
    }
  }




  
  </style>
</head>
<body>
  <div class="container">
      <div class="box">
      </div>
  </div>
  <div class="container">
  <div class="cube">
    <div class="face front"></div>
    <div class="face back"></div>
    <div class="face right"></div>
    <div class="face left"></div>
    <div class="face top"></div>
    <div class="face bottom"></div>
  </div>
</div>

<div class="container2">
  <div class="sphere"></div>
</div>
</div>
</body>
</html>
