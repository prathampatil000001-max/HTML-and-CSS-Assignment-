
<!DOCTYPE html>
<html>
<head>
    <title>Container Example</title>

    <style>
        .container {
            width: 400px;
            padding: 20px;
            background-color: lightblue;
            border: 2px solid blue;
            border-radius: 10px;
            margin: 50px auto;
        }

        p {
            font-size: 20px;
            color: black;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <p>Hello! This is a paragraph inside a container.</p>
    </div>

</body>
</html>
